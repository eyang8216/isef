    <script>
        // Lesson Data
        const lessonData = LESSON_DATA_PLACEHOLDER;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            populateLearningObjectives();
            populateContentSections();
            populateDefinitions();
            populateProblems();
            populateExamTips();
            initProgressTracking();
            loadProgress();
        });

        function populateLearningObjectives() {
            const list = document.getElementById('objectives-list');
            lessonData.learning_objectives.forEach(obj => {
                const li = document.createElement('li');
                li.textContent = obj;
                list.appendChild(li);
            });
        }

        function populateContentSections() {
            const container = document.getElementById('content-sections');
            lessonData.content_sections.forEach(section => {
                const div = document.createElement('div');
                div.className = 'content-section';

                const heading = document.createElement('h2');
                heading.textContent = section.heading;
                div.appendChild(heading);

                const content = document.createElement('div');
                content.innerHTML = formatContent(section.content);
                div.appendChild(content);

                container.appendChild(div);
            });
        }

        function formatContent(content) {
            // Convert markdown-style formatting to HTML
            content = content.replace(/## (.*?)\\n/g, '<h3>$1</h3>');
            content = content.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>');
            content = content.replace(/\\n\\n/g, '</p><p>');
            content = content.replace(/^(.+)$/gm, '<p>$1</p>');
            return content;
        }

        function populateDefinitions() {
            const container = document.getElementById('definitions-container');
            lessonData.key_definitions.forEach(def => {
                const box = document.createElement('div');
                box.className = 'definition-box';

                const term = document.createElement('div');
                term.className = 'definition-term';
                term.textContent = def.term;
                box.appendChild(term);

                const text = document.createElement('div');
                text.className = 'definition-text';
                text.innerHTML = def.definition;
                box.appendChild(text);

                container.appendChild(box);
            });
        }

        function populateProblems() {
            const container = document.getElementById('problems-container');
            lessonData.practice_problems.forEach((problem, index) => {
                const div = document.createElement('div');
                div.className = 'practice-problem';

                const header = document.createElement('div');
                header.className = 'problem-header';
                header.textContent = `Problem ${index + 1}`;
                div.appendChild(header);

                const question = document.createElement('div');
                question.className = 'problem-question';
                question.innerHTML = problem.question;
                div.appendChild(question);

                const button = document.createElement('button');
                button.className = 'solution-toggle';
                button.textContent = 'Show Solution';
                button.onclick = function() {
                    toggleSolution(this);
                };
                div.appendChild(button);

                const solution = document.createElement('div');
                solution.className = 'solution-content';
                solution.innerHTML = '<strong>Solution:</strong><br>' + problem.solution;
                if (problem.explanation) {
                    solution.innerHTML += '<br><br><strong>Explanation:</strong><br>' + problem.explanation;
                }
                div.appendChild(solution);

                container.appendChild(div);
            });
        }

        function populateExamTips() {
            const list = document.getElementById('exam-tips-list');
            lessonData.exam_tips.forEach(tip => {
                const li = document.createElement('li');
                li.textContent = tip;
                list.appendChild(li);
            });
        }

        function toggleSolution(button) {
            const solution = button.nextElementSibling;
            solution.classList.toggle('active');
            button.textContent = solution.classList.contains('active') ? 'Hide Solution' : 'Show Solution';
        }

        function initProgressTracking() {
            window.addEventListener('scroll', updateProgress);
        }

        function updateProgress() {
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight - windowHeight;
            const scrolled = window.scrollY;
            const progress = (scrolled / documentHeight) * 100;

            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-percent').textContent = Math.round(progress) + '%';

            saveProgress(progress);
        }

        function saveProgress(progress) {
            localStorage.setItem('D1_progress', progress);
        }

        function loadProgress() {
            const savedProgress = localStorage.getItem('D1_progress');
            if (savedProgress) {
                document.getElementById('progress-fill').style.width = savedProgress + '%';
                document.getElementById('progress-percent').textContent = Math.round(savedProgress) + '%';
            }
        }

        function markComplete() {
            localStorage.setItem('D1_complete', 'true');
            alert('Lesson marked as complete! Great work!');
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('progress-percent').textContent = '100%';
        }

        function openChatbot() {
            alert('Chatbot feature coming soon! This will connect to an AI assistant to help answer your questions.');
        }

        function previousLesson() {
            window.location.href = '/lessons/previous';
        }

        function nextLesson() {
            window.location.href = '/lessons/next';
        }
    </script>

                {
                    "heading": "Introduction: Why Gravitational Fields Matter",
                    "content": "Gravitational fields are fundamental to understanding the universe at all scales—from the fall of an apple to the motion of galaxies. Unlike contact forces, gravity acts at a distance, making it a field force. This topic builds on your knowledge of forces and circular motion from earlier units and extends it to explain satellite orbits, planetary motion, and even the structure of the cosmos.\n\nKey prerequisite knowledge:\n- Newton's laws of motion (Topic 2)\n- Circular motion and centripetal force (Topic 6)\n- Work and energy (Topic 2)\n- Vector addition and resolution\n\nThe IB examination expects you to move beyond plug-and-chug calculations to demonstrate deep conceptual understanding, particularly distinguishing between field strength and potential, and analyzing energy transformations."
                },
                {
                    "heading": "Newton's Law of Universal Gravitation",
                    "content": "## The Fundamental Principle\n\nNewton proposed that every mass in the universe attracts every other mass with a force that is:\n1. Directly proportional to the product of their masses\n2. Inversely proportional to the square of their separation\n\nMathematically:\n\n$$F = \\frac{Gm_1m_2}{r^2}$$\n\nwhere:\n- $F$ = gravitational force (N)\n- $G$ = universal gravitational constant = $6.67 \\times 10^{-11}$ N m² kg⁻²\n- $m_1, m_2$ = masses of the two objects (kg)\n- $r$ = distance between centers of mass (m)\n\n## Important Points to Understand\n\n**The inverse-square relationship:** Doubling the distance reduces the force to one-quarter. This arises from geometric spreading—the same gravitational influence spreads over an area that increases as $r^2$.\n\n**Point masses and spherical symmetry:** For spherically symmetric objects, we can treat the entire mass as if concentrated at the center. This is why we use $r$ as the distance between centers, not surfaces.\n\n**Action-reaction pairs:** By Newton's third law, both objects experience equal magnitude forces in opposite directions. The Earth pulls on you with the same force you pull on the Earth—you don't notice the Earth's acceleration because of its enormous mass."
                }

                {
                    "term": "Gravitational Field",

                },
                {
                    "term": "Gravitational Field Strength (g)",
                    "definition": "The gravitational force per unit mass at a point in the field. Measured in N kg⁻¹ or m s⁻². For a point mass: $g = \\frac{GM}{r^2}$"
                },
                {
                    "term": "Gravitational Potential (V)",
                    "definition": "The work done per unit mass in bringing a small test mass from infinity to that point. Always negative or zero. $V = -\\frac{GM}{r}$ (J kg⁻¹)"
                },
                {
                    "term": "Gravitational Potential Energy",

                {
                    "term": "Escape Velocity",

                    "explanation": "(c) Mercury's escape velocity is relatively low, and its proximity to the Sun means surface temperatures are very high. Gas molecules (especially light ones like H₂ and He) have root-mean-square speeds comparable to or exceeding escape velocity at these temperatures. Over billions of years, atmospheric molecules escape to space. Venus is cooler (despite being closer—due to its reflective clouds) and has higher escape velocity, allowing it to retain its atmosphere. This demonstrates the interplay between thermal energy (temperature), molecular mass, and gravitational binding energy."

                    "solution": "$r_1 = R_E + h = 6.37 \\times 10^6 + 1.20 \\times 10^6 = 7.57 \\times 10^6$ m<br><br>(a) $v = \\sqrt{\\frac{GM}{r}} = \\sqrt{\\frac{(6.67 \\times 10^{-11})(5.97 \\times 10^{24})}{7.57 \\times 10^6}} = 7260$ m s⁻¹<br><br>(b) $T = \\frac{2\\pi r}{v} = \\frac{2\\pi(7.57 \\times 10^6)}{7260} = 6550$ s $= 109$ min $= 1.82$ hours<br><br>(c) $E_k = \\frac{1}{2}mv^2 = \\frac{1}{2}(850)(7260)^2 = 2.24 \\times 10^{10}$ J<br><br>(d) $E_p = -\\frac{GMm}{r} = -\\frac{(6.67 \\times 10^{-11})(5.97 \\times 10^{24})(850)}{7.57 \\times 10^6} = -4.48 \\times 10^{10}$ J<br><br>(e) $E_{total} = E_k + E_p = 2.24 \\times 10^{10} - 4.48 \\times 10^{10} = -2.24 \\times 10^{10}$ J<br><br>(f) For new orbit: $r_2 = 6.37 \\times 10^6 + 2.40 \\times 10^6 = 8.77 \\times 10^6$ m<br><br>$E_{total,2} = -\\frac{GMm}{2r_2} = -\\frac{(6.67 \\times 10^{-11})(5.97 \\times 10^{24})(850)}{2(8.77 \\times 10^6)} = -1.93 \\times 10^{10}$ J<br><br>Energy required: $\\Delta E = E_{total,2} - E_{total,1} = -1.93 \\times 10^{10} - (-2.24 \\times 10^{10}) = 3.1 \\times 10^9$ J",
