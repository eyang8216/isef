[theme]
primaryColor = "#1f4788"           # Academic blue
backgroundColor = "#ffffff"         # Clean white
secondaryBackgroundColor = "#f5f7fa"  # Light gray for containers
textColor = "#2c3e50"              # Dark gray text
font = "serif"                      # Academic serif font

[server]
port = 8501
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
