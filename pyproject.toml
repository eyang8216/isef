[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isef-taylor-cone-solver"
version = "0.1.0"
description = "Reduced-order axisymmetric electrostatic-capillary Taylor-cone solver for ISEF physics research"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "plotly==6.9.0",
]

[project.optional-dependencies]
dev = ["pytest"]
imaging = ["Pillow", "opencv-python"]
app = ["streamlit==1.60.0"]

[tool.setuptools]
package-dir = {"" = "solver"}
packages = ["solver"]

[tool.pytest.ini_options]
testpaths = ["solver/tests"]
pythonpath = ["solver"]
addopts = "-q"
