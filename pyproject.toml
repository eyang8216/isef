[project]
name = "isef-taylor-cone-solver"
version = "0.1.0"
description = "Reduced-order axisymmetric electrostatic-capillary Taylor-cone solver for an ISEF physics project"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
